# The submission service, deployed to Cloudflare Workers with `npx wrangler deploy` from this folder. See README.md.
name = "opencontext-submit"
main = "worker.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "rafunds3d/OpenContext"                    # owner/repository that receives the pull requests
GITHUB_BASE = "main"                                     # branch GitHub Pages deploys from
SITE_URL = "https://rafunds3d.github.io/OpenContext/"    # where the confirmation link sends people back to
SITE_NAME = "OpenContext"
ALLOWED_ORIGIN = "https://rafunds3d.github.io"           # the site's origin, for browsers' cross-origin checks
MAIL_PROVIDER = "brevo"                                  # "brevo" (verify one sender address) or "resend" (verify a domain)
MAIL_FROM = "OpenContext <rafael.wagner@uni-ulm.de>"     # the verified sender
# Institutional domains missing from the public university list, comma-separated. Keep in step with SITE.submit.extraDomains.
EXTRA_DOMAINS = "perimeterinstitute.ca,oeaw.ac.at,iqoqi-vienna.at,mpg.de,cnrs.fr,cern.ch,ictp.it,icfo.eu,inl.int,ist.ac.at,ucl.ac.uk,cwi.nl,weizmann.ac.il"

# Pending submissions wait here for their confirmation link (24 h), and the university list is cached here for a week.
# Create it with `npx wrangler kv namespace create SUBMISSIONS` and paste the id it prints.
[[kv_namespaces]]
binding = "SUBMISSIONS"
id = "PASTE_THE_ID_PRINTED_BY_wrangler_kv_namespace_create"

# Secrets, set with `npx wrangler secret put NAME` (never written here):
#   GITHUB_TOKEN   a fine-grained personal access token for the repository above, Contents: read and write, Pull requests: read and write
#   MAIL_API_KEY   the Brevo (or Resend) API key
